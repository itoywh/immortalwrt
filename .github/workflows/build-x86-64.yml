name: Build ImmortalWrt x86_64 (DYNAMIC_FTRACE)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ImmortalWrt ref to build
        required: false
        default: v25.12.1
  push:
    branches: [build-dynamic-ftrace]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'v25.12.1' }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev wget bash

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (x86_64 + DYNAMIC_FTRACE)
        run: |
          # 选目标：x86 -> x86_64 -> generic
          echo 'CONFIG_TARGET_x86=y' > .config
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_TARGET_x86_64_DEVICE_generic=y' >> .config
          make defconfig
          # 开 ftrace / dynamic ftrace（dae 的 fentry 需要这个才能 poke NOP 桩）
          # 注意：新版 immortalwrt 的 scripts/config 已变成目录，不能用 ./scripts/config -e
          # 改为直接写 .config 再 make defconfig 合并（defconfig 模式会保留已设符号）
          echo 'CONFIG_KERNEL_FTRACE=y' >> .config
          echo 'CONFIG_KERNEL_FUNCTION_TRACER=y' >> .config
          echo 'CONFIG_KERNEL_DYNAMIC_FTRACE=y' >> .config
          make defconfig
          echo "=== resolved KERNEL_* symbols in .config ==="
          grep -E 'CONFIG_KERNEL_(FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE)=' .config
          echo "=== assert DYNAMIC_FTRACE enabled ==="
          grep -qx 'CONFIG_KERNEL_DYNAMIC_FTRACE=y' .config || { echo "ERROR: KERNEL_DYNAMIC_FTRACE not enabled in .config"; exit 1; }

      - name: Build
        run: make -j$(nproc) world

      - name: Verify DYNAMIC_FTRACE in built kernel config
        run: |
          find build_dir -name .config -path '*linux-x86_64*' \
            -exec grep -H -E 'CONFIG_(DYNAMIC_FTRACE|FUNCTION_TRACER|FTRACE)=' {} \;

      - name: Upload combined-efi image
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-combined-efi
          path: bin/targets/x86/64/*combined-efi*.img.gz
          if-no-files-found: error

      - name: Notify success (ServerChan)
        if: success()
        continue-on-error: true
        run: |
          curl -sS -G "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=✅ immortalwrt x86_64 构建成功 (DYNAMIC_FTRACE)" \
            --data-urlencode "desp=run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify failure (ServerChan)
        if: failure()
        continue-on-error: true
        run: |
          curl -sS -G "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=❌ immortalwrt x86_64 构建失败" \
            --data-urlencode "desp=run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
