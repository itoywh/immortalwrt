name: Build ImmortalWrt x86_64 (DYNAMIC_FTRACE)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ImmortalWrt ref to build
        required: false
        default: v25.12.1
  push:
    branches: [build-dynamic-ftrace]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'v25.12.1' }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev wget bash
          # x86_64 镜像生成所需的宿主工具（官方 config.buildinfo 默认开启 ISO/VMDK/VHDX）
          # ubuntu runner 默认没有，缺失会导致 image prereq 检查失败（mkisofs 报错）
          sudo apt-get install -y genisoimage mtools qemu-utils
          # 限制 ccache 体积，避免把 runner 磁盘吃满
          ccache --max-size=8G || true

      - name: Restore build cache (incremental)
        id: cache
        uses: actions/cache/restore@v4
        with:
          # 同一 ref 共享一份缓存：首跑全量并落盘，之后只重编改动部分（内核+镜像）
          key: owrt-x86-64-dft-${{ github.event.inputs.ref || 'v25.12.1' }}
          path: |
            dl
            staging_dir
            .ccache
            build_dir

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (official 25.12.1 base — baseline run, no dae delta)
        run: |
          # 以官方发布时的完整构建配置为底座（含全部默认包集 + FTRACE/BTF/KPROBES/NETKIT + ALL_KMODS）
          # 纯官方基线运行：不加重 DYNAMIC_FTRACE / 不显式加 nft kmod，先跑通留 cache
          curl -sSL "https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/config.buildinfo" -o .config
          # 仅关掉吃磁盘的非功能选项（保留 ALL_KMODS，让官方 kmod 随内核一起编、自洽）
          sed -i 's/^CONFIG_COLLECT_KERNEL_DEBUG=y/# CONFIG_COLLECT_KERNEL_DEBUG is not set/' .config
          # 确保目标无误
          echo 'CONFIG_TARGET_x86_64_DEVICE_generic=y' >> .config
          make defconfig
          # ccache（编译器缓存）：首次填充，之后相同源码命中率 ~65%+，数量级加速
          echo 'CONFIG_DEVEL=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          # 基线阶段不加重 DYNAMIC_FTRACE（dae 的 fentry→kprobe 回退在 6.12 上已 work）；后续叠加阶段再加
          # 基线阶段不显式加 nft kmod（ALL_KMODS 已把它们编成包）；后续叠加阶段再显式烘焙进镜像
          make defconfig
          # 剔除官方 buildbot 全量测试/开发/构建冗余包（路由器固件用不到，且 kselftests-bpf 会导致构建失败）
          # kselftests-bpf 是内核 BPF 自测套件，纯开发用途，上次 <3h build 收尾时挂掉
          sed -i 's/^CONFIG_PACKAGE_kselftests-bpf=[ym]/# CONFIG_PACKAGE_kselftests-bpf is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_perf=[ym]/# CONFIG_PACKAGE_perf is not set/' .config
          # 只编默认 x86/64 设备，跳过所有机型镜像（官方 buildbot 全量 ALL_PROFILES 纯浪费时间）
          sed -i 's/^CONFIG_TARGET_ALL_PROFILES=y/# CONFIG_TARGET_ALL_PROFILES is not set/' .config
          # 不需要 ImageBuilder/SDK（开发用，固件不需要）
          sed -i 's/^CONFIG_IB=y/# CONFIG_IB is not set/' .config
          sed -i 's/^CONFIG_SDK=y/# CONFIG_SDK is not set/' .config
          sed -i 's/^CONFIG_SDK_LLVM_BPF=y/# CONFIG_SDK_LLVM_BPF is not set/' .config
          echo "=== buildbot-trim applied ==="
          grep -E 'CONFIG_PACKAGE_kselftests-bpf|CONFIG_TARGET_ALL_PROFILES|CONFIG_IB|CONFIG_SDK' .config || true
          echo "=== resolved KERNEL_* symbols in .config ==="
          grep -E 'CONFIG_KERNEL_(FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE|BTF|NETKIT|KPROBES)=' .config
          echo "=== ccache enabled? ==="
          grep -E 'CONFIG_CCACHE=y' .config
          echo "=== baseline assertions: ccache + official base present ==="
          grep -qx 'CONFIG_CCACHE=y' .config || { echo "ERROR: CCACHE not enabled"; exit 1; }
          grep -qE '^CONFIG_ALL_KMODS=y' .config || { echo "ERROR: ALL_KMODS not enabled in baseline"; exit 1; }

      - name: Prepare ccache wrapper (fix incremental-cache race)
        run: |
          # 增量缓存恢复后，staging_dir/host/bin/ccache 可能缺失（tools/ccache 尚未安装），
          # 导致 liblzo 等走 cmake 的 host 工具在并编时 127（command not found）。
          # 用 apt 已装的 ccache 直接建软链，保证该路径在 world 开始前一定存在，
          # 彻底消掉竞态；每次运行都重新建，不依赖缓存状态。
          mkdir -p staging_dir/host/bin
          ln -sf "$(command -v ccache)" staging_dir/host/bin/ccache
          ls -l staging_dir/host/bin/ccache

      - name: Build
        run: make -j$(nproc) world

      - name: Verify baseline kernel config (official FTRACE/BTF/NETKIT present, DYNAMIC_FTRACE absent by design)
        run: |
          find build_dir -name .config -path '*linux-x86_64*' \
            -exec grep -H -E 'CONFIG_(FTRACE|FUNCTION_TRACER|BTF|NETKIT|KPROBES|ALL_KMODS)=' {} \;

      - name: Upload combined-efi image
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-combined-efi
          path: bin/targets/x86/64/*combined-efi*.img.gz
          if-no-files-found: error

      - name: Save build cache (incremental)
        # 只有成功才落盘：失败的运行会留下缺 ccache 二进制的半成品 staging_dir，
        # 若也存进去，下次 restore 会把毒缓存拉回来导致 liblzo 永远 127（死循环）
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: owrt-x86-64-dft-${{ github.event.inputs.ref || 'v25.12.1' }}
          path: |
            dl
            staging_dir
            .ccache
            build_dir

      - name: Notify success (ServerChan)
        if: success()
        continue-on-error: true
        run: |
          curl -sS -G "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=✅ immortalwrt x86_64 官方基线构建成功 (cache seeded)" \
            --data-urlencode "desp=run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify failure (ServerChan)
        if: failure()
        continue-on-error: true
        run: |
          curl -sS -G "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=❌ immortalwrt x86_64 构建失败" \
            --data-urlencode "desp=run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
